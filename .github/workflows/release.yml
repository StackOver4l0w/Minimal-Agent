name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g., v1.0.0)"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # The three Windows arches the C2 Agents table tags (X86/AMD64/ARM64)
          - { arch: i386,    triple: i686-w64-mingw32,    extra: -mno-sse }
          - { arch: x86_64,  triple: x86_64-w64-mingw32,  extra: "" }
          - { arch: aarch64, triple: aarch64-w64-mingw32,  extra: "" }
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0        # BUILD_NUMBER = git rev-list --count HEAD

      # Asset names changed over time (ucrt-x86_64-linux.tar.xz →
      # ucrt-ubuntu-XX.04-x86_64.tar.xz), so pick the URL from the release
      # assets instead of hardcoding a filename.
      - name: Resolve llvm-mingw version
        id: llvm-mingw
        run: |
          json=$(curl -fsSL https://api.github.com/repos/mstorsjo/llvm-mingw/releases/latest)
          echo "version=$(echo "$json" | jq -r .tag_name)" >> "$GITHUB_OUTPUT"
          url=$(echo "$json" | jq -r '
            .assets[].browser_download_url
            | select(test("ucrt-.*(linux|ubuntu-).*x86_64.*\\.tar\\.xz$"))' | head -1)
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Cache llvm-mingw
        id: cache-llvm-mingw
        uses: actions/cache@v6
        with:
          path: /opt/llvm-mingw
          key: llvm-mingw-${{ steps.llvm-mingw.outputs.version }}-linux-x64

      - name: Install llvm-mingw
        if: steps.cache-llvm-mingw.outputs.cache-hit != 'true'
        run: |
          curl -fSL -o llvm-mingw.tar.xz "${{ steps.llvm-mingw.outputs.url }}"
          sudo mkdir -p /opt/llvm-mingw
          sudo tar -xf llvm-mingw.tar.xz --strip-components=1 -C /opt/llvm-mingw
          rm llvm-mingw.tar.xz

      - name: Add llvm-mingw to PATH
        run: echo "/opt/llvm-mingw/bin" >> "$GITHUB_PATH"

      - name: Build
        run: |
          BUILD_NUMBER=$(git rev-list --count HEAD)
          COMMIT_HASH=$(git rev-parse --short=8 HEAD)
          DEFS="-DLOGGING_ENABLED"
          EXE=minimal_agent.exe
          BIN=minimal_agent.bin
          echo "=== building windows-${{ matrix.arch }} (${{ matrix.triple }}-gcc) ==="
          # entry.c MUST stay FIRST on the command line and carries only
          # entry() (the stack probes live in src/stack_probes.c). Merge
          # read-only log/string data into .text so the extracted blob
          # contains every RIP-relative target it uses. llvm-mingw uses lld,
          # whose PE linker accepts /merge rather than GNU ld's -T.
            rm -rf obj
            mkdir -p obj
            ${{ matrix.triple }}-gcc -O2 -Iinclude $DEFS -Wall -Wextra \
              -fno-asynchronous-unwind-tables -fno-ident -fno-stack-protector -fno-jump-tables -fno-vectorize -fno-slp-vectorize ${{ matrix.extra }} \
              -DID_BUILD_NUMBER="$BUILD_NUMBER" \
              -DAGENT_COMMIT_HASH="\"$COMMIT_HASH\"" \
              -c \
              entry.c src/stack_probes.c src/picfixup.c src/main.c src/identity_headers.c \
              src/transport.c src/shell.c src/report.c src/system_facts.c \
              src/environment.c src/winhttp_api.c src/ntdll.c src/kernel32.c \
              src/advapi.c src/string.c src/logfmt.c src/memory.c src/peb.c \
              src/system.c src/djb2.c src/logger.c
            mv ./*.o obj/
            objects=(obj/entry.o)
            for object in obj/*.o; do
            [ "$object" = "obj/entry.o" ] || objects+=("$object")
            done
            PICDATA=""
            if [ "${{ matrix.arch }}" = "i386" ]; then
              printf '.section .picdata,"xr"\n.globl _pic_reloc\n.globl pic_reloc\n.globl _pic_reloc_size\n.globl pic_reloc_size\n.globl _pic_text_size\n.globl pic_text_size\n.p2align 2\n.long 0x50494301\n_pic_reloc:\npic_reloc:\n.space 8184\n.long 0x50494302\n_pic_reloc_size:\npic_reloc_size:\n.long 0x50494303\n_pic_text_size:\npic_text_size:\n.long 0\n' > picdata.s
              ${{ matrix.triple }}-gcc -c picdata.s -o obj/picdata.o
              objects+=("obj/picdata.o")
              PICDATA="-Wl,/merge:.picdata=.text"
            fi
            ${{ matrix.triple }}-gcc -O2 -s -nostdlib -Iinclude $DEFS -Wall -Wextra \
              -fno-asynchronous-unwind-tables -fno-ident -fno-stack-protector -fno-jump-tables -fno-vectorize -fno-slp-vectorize ${{ matrix.extra }} \
              -e entry \
              -Wl,/merge:.rdata=.text -Wl,/merge:.rodata=.text $PICDATA \
              -o "$EXE" "${objects[@]}"
          ${{ matrix.triple }}-objcopy --dump-section .text="$BIN" "$EXE"

          if [ "${{ matrix.arch }}" = "i386" ]; then
            ${{ matrix.triple }}-objcopy --dump-section .reloc=blob.reloc "$EXE"
            TEXT_SIZE=$(stat -c%s "$BIN")
            RELOC_SIZE=$(stat -c%s blob.reloc)
            HEX=$(od -An -tx1 -v "$BIN" | tr -d ' \n')
            OFF1=$(printf '%s' "$HEX" | awk '{n=index($0,"01434950"); if(n>0) print (n-1)/2}')
            OFF2=$(printf '%s' "$HEX" | awk '{n=index($0,"02434950"); if(n>0) print (n-1)/2}')
            OFF3=$(printf '%s' "$HEX" | awk '{n=index($0,"03434950"); if(n>0) print (n-1)/2}')
            dd if=blob.reloc of="$BIN" bs=1 conv=notrunc seek=$((OFF1 + 4)) status=none
            awk -v n="$RELOC_SIZE" 'BEGIN { printf "%c%c%c%c", n%256, int(n/256)%256, int(n/65536)%256, int(n/16777216)%256 }' | dd of="$BIN" bs=1 seek=$((OFF2 + 4)) conv=notrunc status=none
            awk -v n="$TEXT_SIZE" 'BEGIN { printf "%c%c%c%c", n%256, int(n/256)%256, int(n/65536)%256, int(n/16777216)%256 }' | dd of="$BIN" bs=1 seek=$((OFF3 + 4)) conv=notrunc status=none
            echo "pic reloc: $RELOC_SIZE bytes into reserve at blob+0x$((OFF1 + 4)), text=$TEXT_SIZE"
            [ -n "$OFF1" ] && [ "$RELOC_SIZE" -gt 0 ] && [ "$RELOC_SIZE" -le 8184 ] || { echo "FAIL: pic reloc reserve overflow"; exit 1; }
          fi

          imp=$(${{ matrix.triple }}-objdump -p "$EXE" | grep -c 'DLL Name' || true)
          echo "imports: $imp (want 0)"
          [ "$imp" = "0" ] || { echo "FAIL: import table not empty"; exit 1; }

          image_base=$(${{ matrix.triple }}-objdump -p "$EXE" | sed -n 's/^[[:space:]]*ImageBase[[:space:]:]*//p' | awk '{print $1; exit}' | sed 's/^0x//')
          entry_rva=$(${{ matrix.triple }}-objdump -p "$EXE" | sed -n 's/^[[:space:]]*AddressOfEntryPoint[[:space:]:]*//p' | awk '{print $1; exit}' | sed 's/^0x//')
          text_vma=$(${{ matrix.triple }}-objdump -h "$EXE" | awk '$2 == ".text" {print $4; exit}' | sed 's/^0x//')
          test -n "$image_base" || { echo "FAIL: could not read PE image base"; exit 1; }
          test -n "$entry_rva" || { echo "FAIL: could not read PE entry RVA"; exit 1; }
          test -n "$text_vma" || { echo "FAIL: could not read .text VMA"; exit 1; }
          entry_va=$(( 0x$image_base + 0x$entry_rva ))
          entry_off=$(( entry_va - 0x$text_vma ))
          echo "entry offset in .text: $entry_off (want 0)"
          [ "$entry_off" = "0" ] || { echo "FAIL: entry() is not at .text byte 0"; exit 1; }

          head -c 2 "$BIN" | od -c | head -1
          if [ "$(head -c 2 "$BIN")" = "MZ" ]; then
            echo "FAIL: .bin starts with the PE header - objcopy copied the image"
            exit 1
          fi


          # Gate 4: all read-only blob data must be inside .text. Since the
          # linker intentionally merges data into .text, objdump -d cannot
          # distinguish embedded strings from instructions and cannot safely
          # validate RIP-relative references in the final image.
          for section in .rdata .rodata .data .bss .pdata .xdata; do
            if ${{ matrix.triple }}-objdump -h "$EXE" | awk -v name="$section" '$2 == name { found = 1 } END { exit !found }'; then
              echo "FAIL: forbidden separate section remains: $section"
              exit 1
            fi
          done
          echo "blob section layout: .text contains read-only data; no separate data sections"

          # Gate 5: logging is enabled in every build, so log literals are
          # expected. The section and blob-layout gates still ensure those
          # literals remain inside .text.
          mkdir -p artifacts
          cp "$EXE" "artifacts/windows-${{ matrix.arch }}.exe"
          cp "$BIN" "artifacts/windows-${{ matrix.arch }}.bin"
          ls -la artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-windows-${{ matrix.arch }}
          retention-days: 1
          path: artifacts/

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: release-* 

      - name: Collect release files
        run: |
          mkdir -p release-files
          find artifacts -type f -exec cp {} release-files/ \;
          echo "Release files:"
          ls -lh release-files/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-files/* --clobber
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              release-files/*
          fi
